[package]
name = "driver_sgtl5000"
version = "0.1.0"
edition = "2021"
authors = ["Daniël <daniel@hi-squeaky-things.nl>"]
description = "A Rust #no-std optimized wave table synthesizer for embedded devices."
license = "MIT"
repository = "https://github.com/hi-squeaky-things/driver-sgtl5000"
keywords = ["no-std", "i2s", "driver", "sgtl5000"]
categories = ["embedded"]

[dependencies]
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }

[dev-dependencies]
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "println", "esp32s3"] }
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram"] }
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
embassy-executor = { version = "0.9.0", features = [] }
embassy-time     = "0.5.0"
embassy-sync = "0.7.2"
esp-alloc        = "0.9.0"


[profile.dev]
opt-level = 1
